[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ayloor-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.18,<4", "pydantic-settings>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools]
packages = ["ayloor_bot"]
package-dir = {ayloor_bot = "app"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
